# Publishes a new version of the game for players (M10, owner's choice 2026-11-14): builds the
# Windows .exe on GitHub and creates a release in the public repository
# slota145/YourKingdom-Releases, where the game's updater looks for new versions.
# Started by hand (Actions -> Release -> Run workflow, or from a Claude session) on main.
# The version is application/config/version in project.godot: bump it first.
# Needs the secret RELEASES_TOKEN: a fine-grained token with Contents read and write on the
# public repository (docs/CLOUD_SETUP.md, "Wydania").
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Co nowego w tej wersji (widzi to gracz)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Godot and the export templates
        run: |
          GODOT="$(tools/setup_godot.sh)"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          python3 tools/get_export_templates.py

      - name: Version
        run: |
          VERSION="$(grep -oP '^config/version="\K[^"]+' project.godot)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"

      - name: Smoke run of an exported build (Linux)
        run: tools/export_game.sh linux

      - name: Windows build
        run: |
          tools/export_game.sh windows
          cd build/windows
          sha256sum YourKingdom.exe | cut -d' ' -f1 > YourKingdom.exe.sha256
          cat YourKingdom.exe.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION" build/windows/YourKingdom.exe build/windows/YourKingdom.exe.sha256 \
            --repo slota145/YourKingdom-Releases --title "Your Kingdom $VERSION" \
            --notes "${NOTES:-Nowa wersja gry.}"
