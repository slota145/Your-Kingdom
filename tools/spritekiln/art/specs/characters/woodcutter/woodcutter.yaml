spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: woodcutter
camera: {pitch: 30, scale: 0.05176}   # pitch 30: matches the game's 2:1 isometric ground (sin 30 = 0.5)
palette: ../../palettes/kingdom.yaml
extends: humanoid
remove: [use.sword, animations.attack]

brief:
  summary: "Your Kingdom woodcutter: straight red wool tunic to mid-thigh, grey-brown trousers, dark leather belt and boots, axe in the right hand"
  head: "short brown hair with a light fringe, square jaw, a full short brown beard, eyes only (minimal face)"
  must_keep: ["red tunic reads at 1x zoom", "axe readable in every direction", "beard breaks the head outline in s, se, e"]
  simplify: ["no buttons or seams"]

use:
  - {kit: axe, as: axe, at: wrist_R, with: {length: 0.5, pitch: axe_pitch, cheat: axe_cheat}}
  - {kit: head, at: head, with: {width: 1.05, jaw: 0.6, chin: 0.4, nose: 0, ears: 0}}
  - {kit: hair, at: head, with: {fringe: 0.4, part: 0.2, locks: 0.5, length: 0.2, volume: 0.9}}

materials:
  cloth: {ramp: tunic}
  trousers: {ramp: trousers}
  wood: {ramp: wood}
  hair: {ramp: hair}
  ink: {ramp: hair, band: 0}

channels:
  axe_cheat: 0.8    # the kit's per-direction turn of the bit to the camera (off while the axe is behind the head)
  axe_pitch: 0      # extra tilt of the axe at the wrist (chop: back over the head, then down in front)

parts:
  leg_L: {material: trousers}
  coat:            # a straight tunic hem to mid-thigh, not a flared coat
    prims:
      - cone: {a: [0, 0.05, -0.01], b: [0, -0.20, -0.02], r: [0.20, 0.205]}
    cut:
      - cone: {a: [0, -0.10, 0.20], b: [0, -0.30, 0.24], r: [0.03, 0.07]}
  beard:           # a full short beard on the jaw and chin, its own part so a line runs round it
    material: hair
    space: head
    blend: 0.02
    prims:
      - ellipsoid: {c: [0, 0.01, 0.075], r: [0.095, 0.065, 0.06]}
      - ellipsoid: {c: [0, -0.035, 0.085], r: [0.06, 0.05, 0.045]}

animations:
  chop:            # two-handed overhead chop at a trunk in front of the feet
    loop: false
    keys:
      - {ms: 120, set: {hand_R: [0.10, 0.30, 0.25], hand_L: [0.05, 0.26, 0.22], axe_pitch: 0.3,
                        foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 110, set: {hand_R: [0.09, 0.85, 0.05], hand_L: [0.05, 0.78, 0.05], axe_pitch: -0.1, lean: -0.04,
                        head_pitch: -0.08, foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 230, event: windup,
         set: {hand_R: [0.10, 1.25, -0.28], hand_L: [0.06, 1.18, -0.28], axe_pitch: -1.6, axe_cheat: 0, lean: -0.12, squash: 0.97,
               bob: 0.01, head_pitch: -0.12, coat: -0.2, foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 50, set: {hand_R: [0.07, 0.75, 0.40], hand_L: [0.04, 0.70, 0.38], axe_pitch: 0.4, lean: 0.18, squash: 1.03,
                       coat: 0.3, foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 140, event: hit,
         set: {hand_R: [0.06, 0.26, 0.48], hand_L: [0.03, 0.23, 0.45], axe_pitch: 1.35, lean: 0.30, bob: -0.04,
               squash: 0.96, head_pitch: 0.10, coat: 0.5, foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 120, set: {hand_R: [0.06, 0.28, 0.46], hand_L: [0.03, 0.25, 0.43], axe_pitch: 1.25, lean: 0.26, bob: -0.03,
                        coat: 0.2, foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
      - {ms: 140, set: {hand_R: [0.09, 0.30, 0.32], hand_L: [0.05, 0.26, 0.28], axe_pitch: 0.6, lean: 0.12,
                        foot_L: [0.15, 0, 0.10], foot_R: [0.15, 0, -0.06]}}
