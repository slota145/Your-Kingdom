spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
# G3 part 1 (owner 2026-11-12): the common townsfolk model. Professions extend it (gen_civilians.py writes them):
# their clothes, headwear, tool and work moves. Not exported itself.
# The socket `load` is where the game draws a carried good (ART_SPEC 5): export_civilian.py turns it into
# <anim>.anchors.png (red pixel = the good's centre, blue = the good behind the body).
name: civilian
size: 64
camera: {pitch: 30, scale: 0.05176, center: [0, 1.554, 0]}   # the feet at (32, 58) of the 64 px frame
palette: [../../palettes/kingdom.yaml, ../../palettes/town.yaml]
shadow: null   # the game draws no shadow under characters
extends: humanoid
remove: [use.sword, animations.attack, parts.smear]

brief:
  summary: "Your Kingdom townsperson: a plain wool shirt to mid-thigh with a belt, hose, leather shoes; professions add colours, headwear, an apron and a tool"
  head: "short hair, eyes only (minimal face)"
  must_keep: ["shirt colour reads at 1x", "hands meet the carried good", "a calm, slower gait than soldiers"]
  simplify: ["no buttons or seams", "no pouch"]

ramps:
  shirt: ["#1a120b", "#3e2e1e", "#5e4630", "#7c6043", "#9a7c58", "#b89a72"]
  hose: ["#120e0b", "#2e2620", "#4a4035", "#665a4b", "#837563", "#a3937c"]
  shoe: ["#140a05", "#2e1b0e", "#4a2e18", "#663f22", "#83552e"]
  belt: ["#120a05", "#2e1b0e", "#4a2e18", "#663f22", "#83552e"]
  apron: ["#1a1208", "#4a3a26", "#7a6448", "#a89070", "#cdb894", "#e8d8b8"]
  hat: ["#1a1208", "#4a3a26", "#7a6448", "#a89070", "#cdb894", "#e8d8b8"]

materials:
  cloth: {ramp: shirt, bands: [1, 5]}
  trousers: {ramp: hose, bands: [1, 4]}
  leather: {ramp: belt, bands: [1, 3]}
  shoe: {ramp: shoe, bands: [1, 3]}
  apron_m: {ramp: apron, bands: [1, 5]}
  hat_m: {ramp: hat, bands: [1, 5]}
  hair: {ramp: hair}
  ink: {ramp: hair, band: 0}

channels:
  load_at: [0, 0.3, 0.3]   # where the carried good sits (torso space); only the carry clips use it
  tool_pitch: 0            # tip of the tool forward from upright in the torso's frame (the professions' work moves)
  tool_cheat: 0            # the tool kit's per-direction turn to the camera
  tool_yaw: 0              # turn of the tool about the body's upright axis (a sickle's sweep)

use:
  - {kit: head, at: head, with: {width: 1.0, jaw: 0.5, chin: 0.5, nose: 0, ears: 0}}
  - {kit: hair, at: head, with: {fringe: 0.4, part: 0.2, locks: 0.5, length: 0.2, volume: 0.9}}

parts:
  leg_L: {material: trousers}
  boot_L:
    material: shoe
    prims:
      - cone: {a: [0, 0.06, 0], b: [0, -0.02, 0.0], r: [0.06, 0.062]}
      - ellipsoid: {c: [0, -0.04, 0.05], r: [0.062, 0.042, 0.105]}
  coat:            # the shirt hangs straight to mid-thigh, split at the sides for walking
    material: cloth
    prims:
      - cone: {a: [0, 0.05, -0.01], b: [0, -0.24, -0.02], r: [0.2, 0.215]}
    cut:
      - box: {c: [0, -0.24, 0], half: [0.4, 0.12, 0.025]}
  belt:
    material: leather
    prims:
      - cylinder: {a: [0, 0.07, 0], b: [0, 0.12, 0], r: 0.2}

sockets:
  load: {bone: torso_rot, offset: load_at}

animations:
  idle:              # the game plays idle at 4 fps
    frames: 4
    ms: 250
    channels:
      bob: "0.02*sin(p)"
      squash: "1 + 0.012*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.31, 0.05 + 0.015*sin(p - 0.6), 0.04]"
      hand_R: "[0.31, 0.05 + 0.015*sin(p - 0.6), 0.04]"
      coat: "0.1*sin(p - 1.0)"
  walk:              # the game plays walks at 10 fps: 8 frames
    frames: 8
    ms: 100
    events: {0: step_l, 4: step_r}
    channels: &walk
      lean: 0.08
      bob: "-0.03*cos(2*p) + 0.01"
      twist: "0.08*cos(p)"
      foot_L: "[0.13, 0.09*pos(-sin(p)), 0.02 + 0.21*cos(p)]"
      foot_R: "[0.13, 0.09*pos(sin(p)), 0.02 - 0.21*cos(p)]"
      pitch_foot_L: "0.4*pos(-sin(p))"
      pitch_foot_R: "0.4*pos(sin(p))"
      hand_L: "[0.31, 0.07 + 0.03*pos(cos(p)), 0.05 - 0.17*cos(p)]"
      hand_R: "[0.31, 0.07 + 0.03*pos(-cos(p)), 0.05 + 0.17*cos(p)]"
      head_yaw: "-0.05*cos(p)"
      coat: "0.4*sin(2*p)"
  carry_sack:        # a sack over the right shoulder, the right hand holding its neck
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: 0.12
      roll: 0.05
      hand_R: "[0.12, 0.60, 0.08]"
      load_at: [-0.16, 0.66, -0.02]
  carry_barrel:      # a barrel on the right shoulder, both hands steadying it
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: 0.12
      roll: 0.07
      bob: "-0.025*cos(2*p) + 0.01"
      hand_R: "[0.10, 0.78, 0.06]"
      hand_L: "[-0.04, 0.70, 0.10]"
      load_at: [-0.17, 0.80, 0.0]
  carry_log:         # a log or planks along the right shoulder
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: 0.12
      roll: 0.05
      hand_R: "[0.10, 0.62, 0.16]"
      hand_L: "[-0.02, 0.52, 0.22]"
      load_at: [-0.16, 0.68, 0.04]
  carry_basket:      # a basket on the right hip
    frames: 8
    ms: 100
    channels:
      <<: *walk
      roll: -0.06
      hand_R: "[0.30, 0.10, 0.06]"
      load_at: [-0.32, 0.10, 0.06]
  carry_bundle:      # a sheaf or bundle on the back, both hands on the straps
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: 0.18
      hand_L: "[0.16, 0.50, 0.12]"
      hand_R: "[0.16, 0.50, 0.12]"
      load_at: [0, 0.66, -0.26]
  carry_crate:       # a crate in front, in both hands
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: -0.02
      twist: "0.04*cos(p)"
      hand_L: "[0.20, 0.24, 0.24]"
      hand_R: "[0.20, 0.24, 0.24]"
      load_at: [0, 0.28, 0.30]
  carry_stone:       # a stone block hugged in front, a shorter heavier step
    frames: 8
    ms: 100
    channels:
      <<: *walk
      lean: -0.05
      bob: "-0.04*cos(2*p) + 0.0"
      twist: "0.03*cos(p)"
      foot_L: "[0.14, 0.06*pos(-sin(p)), 0.02 + 0.14*cos(p)]"
      foot_R: "[0.14, 0.06*pos(sin(p)), 0.02 - 0.14*cos(p)]"
      hand_L: "[0.19, 0.18, 0.24]"
      hand_R: "[0.19, 0.18, 0.24]"
      load_at: [0, 0.22, 0.30]
