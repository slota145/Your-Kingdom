spritekiln: 1
# SpriteKiln trial (ART_SPEC 10.20): the player's cog, 8 directions, gently rocking (like assets/ships/cog/idle.png).
name: cog
render: {outline: dark, lines: depth+normal, light: classic, shading: toon}   # the same "boosted" look as the woodcutter's hut
kind: prop
size: 220                 # the game's cog frame; the waterline centre must land at (110, 168)
directions: 8
mirror: false             # the light comes from the top left in every direction
palette: [../../palettes/kingdom.yaml, ../../palettes/town.yaml]
camera: {pitch: 30, scale: 0.05176, center: [0, 3.47, 0]}   # 58 px above the waterline: pivot (110, 168)
shadow: null
ramps:
  hull:  ["#120a05", "#2a180c", "#432812", "#5e3a1c", "#7a4e28", "#966438"]
  sail:  ["#1a1712", "#4a443a", "#7e7666", "#b4aa94", "#d6cdb6", "#eee8d6"]
  rope:  ["#0e0a06", "#22180e", "#3a2a18", "#54402a"]
  foam:  ["#1a2a38", "#3a5a70", "#7a9ab0", "#b4cad8", "#dce8f0", "#f8fcff"]
  faction: ["#0a0e1c", "#16244c", "#22387a", "#2e54a8", "#4a72c4", "#6e92da"]

brief:
  summary: "Your Kingdom cog (M5): clinker-built round hull with a rising sheer, a crenellated stern castle with faction shields, a small forecastle, one mast with a square sail in the faction's stripes, stays, a pennant and a stern rudder; it floats with the hull cut at the waterline"
  must_keep: ["hull about 6.6 units long (about 130 px from the side)", "waterline centre at (110, 168)", "bow = +z"]

materials:
  hull: {ramp: hull, bands: [2, 5]}
  strake: {ramp: hull, bands: [0, 1], outline: false}
  deck: {ramp: wood, bands: [3, 5]}
  deck_seam: {ramp: wood, bands: [1, 2], outline: false}
  castle: {ramp: wood, bands: [2, 4]}
  mast: {ramp: wood, bands: [2, 4]}
  sail: {ramp: sail, bands: [3, 5], two_sided: true}
  faction: {ramp: faction, bands: [2, 4], two_sided: true}
  rope: {ramp: rope, bands: [1, 2], line: false}
  steel: {ramp: steel, bands: [3, 5]}
  foam: {ramp: foam, bands: [4, 5], outline: false, line: false}
  foam_dark: {ramp: foam, bands: [3, 3], outline: false, line: false}

channels:
  bob: 0.0
  pitch: 0.0
  roll: 0.0

bones:
  ship: {parent: root, pos: "[0, bob - 0.35, 0]", rot: "[pitch, 0, roll]"}   # sunk 0.35: a low freeboard like the game's cog
  sailb: {parent: ship, pos: [0, 0, 0.25], rot: [0, 0.33, 0]}                # the yard braced a little across the wind

parts:
  hull:              # a round hull with nearly upright sides, cut at the waterline and along the sheer, hollow above the deck
    material: hull
    space: ship
    priority: 1
    prims:
      - ellipsoid: {c: [0, 0.6, 0], r: [1.08, 2.5, 1.35], elongate: [0, 0, 1.9]}
    cut:
      - plane: {n: [0, -1, 0], at: -0.35}                          # the waterline (the ship is sunk 0.35)
      - cylinder: {a: [-3, 9.85, 0], b: [3, 9.85, 0], r: 8.6}       # the sheer: the gunwale rises to both ends
      - ellipsoid: {c: [0, 3.08, 0], r: [0.98, 0.08, 1.25], elongate: [0, 2.0, 1.9]}   # the inside of the bulwark
    paint:
      - material: strake
        stripes: {axis: y, period: 0.22, width: 0.06, offset: 0.08}
  deck:
    material: deck
    space: ship
    prims:
      - ellipsoid: {c: [0, 1.02, 0], r: [1.0, 0.05, 1.27], elongate: [0, 0, 1.9]}
    paint:
      - material: deck_seam
        stripes: {axis: x, period: 0.2, width: 0.06}
  stern_castle:      # a boxy castle over the stern with a crenellated rail
    material: castle
    space: ship
    prims:
      - box: {c: [0, 1.55, -2.55], half: [1.02, 0.08, 0.95]}
      - box: {c: [0, 1.85, -2.55], half: [1.02, 0.25, 0.95], shell: 0.1}
      - box: {c: [0.80, 1.20, -1.68], half: [0.06, 0.35, 0.06]}
      - box: {c: [-0.80, 1.20, -1.68], half: [0.06, 0.35, 0.06]}
    cut:
      - plane: {n: [0, 1, 0], at: 2.1}
      - box: {c: [0, 2.06, -2.55], half: [0.94, 0.1, 0.88]}
  merlons:
    material: castle
    space: ship
    prims:
      - box: {c: [1.0, 2.2, -3.2], half: [0.05, 0.1, 0.12]}
      - box: {c: [1.0, 2.2, -2.55], half: [0.05, 0.1, 0.12]}
      - box: {c: [1.0, 2.2, -1.9], half: [0.05, 0.1, 0.12]}
      - box: {c: [-1.0, 2.2, -3.2], half: [0.05, 0.1, 0.12]}
      - box: {c: [-1.0, 2.2, -2.55], half: [0.05, 0.1, 0.12]}
      - box: {c: [-1.0, 2.2, -1.9], half: [0.05, 0.1, 0.12]}
      - box: {c: [0.55, 2.2, -1.62], half: [0.14, 0.1, 0.05]}
      - box: {c: [-0.55, 2.2, -1.62], half: [0.14, 0.1, 0.05]}
      - box: {c: [0.0, 2.2, -1.62], half: [0.14, 0.1, 0.05]}
      - box: {c: [0.55, 2.2, -3.48], half: [0.14, 0.1, 0.05]}
      - box: {c: [-0.55, 2.2, -3.48], half: [0.14, 0.1, 0.05]}
      - box: {c: [0.0, 2.2, -3.48], half: [0.14, 0.1, 0.05]}
  shields_L:         # faction shields along the castle's sides
    material: faction
    space: ship
    priority: 2
    prims:
      - cylinder: {a: [1.03, 1.82, -3.0], b: [1.09, 1.82, -3.0], r: 0.17}
      - cylinder: {a: [1.03, 1.82, -2.55], b: [1.09, 1.82, -2.55], r: 0.17}
      - cylinder: {a: [1.03, 1.82, -2.1], b: [1.09, 1.82, -2.1], r: 0.17}
    paint:
      - material: sail
        prims:
          - box: {c: [1.06, 1.82, -3.0], half: [0.1, 0.035, 0.12]}
          - box: {c: [1.06, 1.82, -2.55], half: [0.1, 0.035, 0.12]}
          - box: {c: [1.06, 1.82, -2.1], half: [0.1, 0.035, 0.12]}
  fore_castle:       # a small platform at the bow
    material: castle
    space: ship
    prims:
      - box: {c: [0, 1.72, 2.85], half: [0.7, 0.06, 0.55]}
      - box: {c: [0, 1.88, 2.85], half: [0.7, 0.16, 0.55], shell: 0.08}
      - cylinder: {a: [0.5, 1.0, 2.4], b: [0.5, 1.7, 2.4], r: 0.05}
      - cylinder: {a: [-0.5, 1.0, 2.4], b: [-0.5, 1.7, 2.4], r: 0.05}
    cut:
      - plane: {n: [0, 1, 0], at: 2.04}
      - box: {c: [0, 2.0, 2.85], half: [0.63, 0.1, 0.48]}
  stem:              # the straight stem and sternpost of a cog
    material: castle
    space: ship
    prims:
      - box: {c: [0, 1.2, 3.42], half: [0.07, 0.75, 0.1], rot: [-0.25, 0, 0]}
      - box: {c: [0, 1.2, -3.4], half: [0.07, 0.75, 0.1], rot: [0.12, 0, 0]}
  rudder:
    material: castle
    space: ship
    prims:
      - box: {c: [0, 0.88, -3.55], half: [0.05, 0.45, 0.2], rot: [0.12, 0, 0]}
      - cylinder: {a: [0, 1.25, -3.65], b: [0, 1.62, -3.1], r: 0.04}
  mast:
    material: mast
    space: ship
    priority: 3
    min_cover: 2
    prims:
      - cylinder: {a: [0, 0.9, 0.25], b: [0, 6.7, 0.25], r: 0.09}
      - cylinder: {a: [0, 6.7, 0.25], b: [0, 7.05, 0.25], r: 0.05}
  yard:
    material: mast
    space: sailb
    priority: 2
    min_cover: 2
    prims:
      - cylinder: {a: [-1.8, 6.15, 0.2], b: [1.8, 6.15, 0.2], r: 0.05}
  sail:              # a square sail filled by the wind: the front cap of a big ellipsoid shell, cut to a rectangle
    material: sail
    space: sailb
    priority: 2
    prims:
      - ellipsoid: {c: [0, 4.6, 0.12], r: [2.4, 2.3, 0.62], shell: 0.08}
    cut:
      - plane: {n: [0, 0, -1], at: -0.24}      # keeps z > 0.24: the cap only
      - plane: {n: [1, 0, 0], at: 1.7}
      - plane: {n: [-1, 0, 0], at: 1.7}
      - plane: {n: [0, 1, 0], at: 6.12}
      - plane: {n: [0, -1, 0], at: -3.05}
    paint:
      - material: faction
        prims:
          - box: {c: [-1.17, 4.6, 0.5], half: [0.24, 1.8, 0.8]}
          - box: {c: [-0.17, 4.6, 0.5], half: [0.24, 1.8, 0.8]}
          - box: {c: [0.83, 4.6, 0.5], half: [0.24, 1.8, 0.8]}
  stays:             # forestay, backstay and shrouds
    material: rope
    space: ship
    min_cover: 2
    prims:
      - cylinder: {a: [0, 6.6, 0.25], b: [0, 1.95, 3.35], r: 0.022}
      - cylinder: {a: [0, 6.6, 0.25], b: [0, 2.25, -3.3], r: 0.022}
      - cylinder: {a: [0, 6.3, 0.25], b: [0.98, 1.1, 0.0], r: 0.02}
      - cylinder: {a: [0, 6.3, 0.25], b: [0.98, 1.1, 0.6], r: 0.02}
      - cylinder: {a: [0, 6.3, 0.25], b: [-0.98, 1.1, 0.0], r: 0.02}
      - cylinder: {a: [0, 6.3, 0.25], b: [-0.98, 1.1, 0.6], r: 0.02}
  pennant:           # a faction pennant at the masthead, streaming aft
    material: faction
    space: ship
    min_cover: 2
    prims:
      - extrude: {c: [0, 6.85, -0.05], rot: [0, 1.5708, 0], depth: 0.06,
                  profile: {polygon: [[-0.3, 0.12], [-0.3, -0.12], [0.55, 0.0]]}}

  foam:              # foam where the hull meets the water: a thin band of the hull's shape, a little wider
    material: foam
    prims:
      - ellipsoid: {c: [0, 0.25, 0], r: [1.2, 2.5, 1.47], elongate: [0, 0, 1.9], shell: 0.26}
      - sphere: {c: [0, 0.0, -3.75], r: 0.18}
      - sphere: {c: [0.25, 0.0, -3.6], r: 0.13}
      - sphere: {c: [-0.25, 0.0, -3.6], r: 0.13}
      - sphere: {c: [0, 0.0, 3.62], r: 0.2}
      - sphere: {c: [0.22, 0.0, 3.45], r: 0.14}
      - sphere: {c: [-0.22, 0.0, 3.45], r: 0.14}
    cut:
      - plane: {n: [0, 1, 0], at: 0.1}
      - plane: {n: [0, -1, 0], at: 0.0}
    paint:
      - material: foam_dark
        spots: {scale: 0.12, density: 0.3, seed: 5}

animations:
  idle:              # the gentle rocking of a ship at anchor: 4 frames, like the current sheet
    frames: 4
    ms: 260
    channels:
      bob: "0.035*sin(p)"
      pitch: "0.022*sin(p + 1.2)"
      roll: "0.035*sin(p + 0.5)"
