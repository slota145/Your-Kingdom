animations:
  idle:
    frames: 8
    ms: 150
    channels: {bob: 0.012*sin(p), tail: 0.6*sin(2*p), ear: '0.25*pulse(t, 0.6, 0.15)', head_pitch: 0.05*sin(p)}
  walk:
    frames: 8
    ms: 95
    events: {0: step, 4: step}
    channels: {swing_a: 0.5*sin(p), swing_b: -0.5*sin(p), bob: 0.018*abs(sin(p)), roll: 0.04*sin(p), head_pitch: 0.06*sin(2*p), tail: 0.4*sin(p),
      ear: 0.15*sin(2*p)}
  root:
    frames: 8
    ms: 130
    channels: {head_pitch: 0.55 + 0.08*sin(2*p), head_yaw: 0.2*sin(p), pitch: '0.12', bob: '-0.02', tail: 0.5*sin(2*p), ear: 0.2*sin(p)}
materials:
  pig:
    ramp: pig
    bands: [2, 5]
    finish: matte
  pig_dark:
    ramp: pig_dark
    bands: [2, 4]
  eye:
    ramp: eye
    bands: [0, 1]
    outline: false
  tusk:
    ramp: tusk
    bands: [1, 3]
