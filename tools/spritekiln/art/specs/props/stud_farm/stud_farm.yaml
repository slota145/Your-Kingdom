  hay:    ['#1c1406', '#4a3812', '#7a6020', '#a88a34', '#cdb050', '#ecd47a']
  mud:    ['#120c08', '#2a1c12', '#3e2a1a', '#523a24', '#664a30']
  slop:   ['#140e08', '#3a2a16', '#5a4424', '#7a5e34']
