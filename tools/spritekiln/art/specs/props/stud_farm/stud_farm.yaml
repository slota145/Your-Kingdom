brief:
  summary: "Your Kingdom stud farm (Z1 part 2, look of its own 2026-11-11), 2x2 tiles, the horses in pens beside it: a tall plank stable with its gable to the yard, a steep shingle roof with a weather vane, a wide braced double door with a horseshoe over it, hay in the loft opening, an open tack shed with a saddle on a rack and hay bales, a stone water trough"
  must_keep: ["footprint 2x2 tiles (4.69 x 4.69 units)", "door on the +z wall at model x -0.59 (game y about 1.25)", "entrance tile (game x 1..2, model z 0..2.34, model x -2.34..0) free to walk"]

