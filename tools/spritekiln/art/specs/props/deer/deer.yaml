spritekiln: 1
# Hand-written (E2 part 2, wild herds), on the pig's skeleton (gen_nature.py): slender, long legs, a neck.
name: deer
render: {outline: dark, lines: depth+normal, light: classic, shading: soft}
kind: prop
shadow: null
ramps:
  coat: ['#1a0e06', '#4a2a12', '#7a4a22', '#a46a34', '#c48a4c', '#dca868']
  coat_dark: ['#140a06', '#30200f', '#4e3218', '#6a4626', '#865c34']
  rump: ['#3a3226', '#7a7060', '#b0a690', '#d8d0bc', '#f2ecdc']
  eye: ['#0a0606', '#1a1010', '#2a1a1a', '#3a2424']
size: 48
directions: 8
mirror: false
camera:
  pitch: 30
  scale: 0.05176
  center: [0, 0.6, 0]
brief: {summary: 'Your Kingdom roe deer (wild herd): slender, tan, long thin legs, neck up, big ears, a white rump; idle, walk, graze'}
channels: {bob: 0.0, pitch: 0.0, roll: 0.0, head_pitch: 0.0, head_yaw: 0.0, tail: 0.0, ear: 0.0, swing_a: 0.0, swing_b: 0.0}
bones:
  body: {parent: root, pos: '[0, 0.62 + bob, 0]', rot: '[pitch, 0, roll]', scale: 0.85}
  head:
    parent: body
    pos: [0, 0.4, 0.42]
    rot: '[head_pitch, head_yaw, 0]'
  tail:
    parent: body
    pos: [0, 0.06, -0.4]
    rot: '[tail, 0, 0]'
  leg_fl:
    parent: body
    pos: [0.09, -0.1, 0.27]
    rot: '[swing_a, 0, 0]'
  leg_br:
    parent: body
    pos: [-0.09, -0.1, -0.27]
    rot: '[swing_a, 0, 0]'
  leg_fr:
    parent: body
    pos: [-0.09, -0.1, 0.27]
    rot: '[swing_b, 0, 0]'
  leg_bl:
    parent: body
    pos: [0.09, -0.1, -0.27]
    rot: '[swing_b, 0, 0]'
parts:
  body:
    material: coat
    space: body
    blend: 0.05
    prims:
    - ellipsoid: {c: [0, 0, 0], r: [0.15, 0.17, 0.38]}
    - cone: {a: [0, 0.08, 0.28], b: [0, 0.38, 0.4], r: [0.1, 0.07]}
  rump:
    material: rump
    space: body
    prims:
    - ellipsoid: {c: [0, 0.03, -0.35], r: [0.11, 0.12, 0.06]}
  head:
    material: coat
    space: head
    blend: 0.03
    prims:
    - ellipsoid: {c: [0, 0.02, 0.04], r: [0.08, 0.08, 0.1]}
    - cone: {a: [0, 0.0, 0.08], b: [0, -0.04, 0.2], r: [0.06, 0.035]}
  muzzle:
    material: coat_dark
    space: head
    prims:
    - sphere: {c: [0, -0.04, 0.21], r: 0.032}
  ears:
    material: coat
    space: head
    prims:
    - ellipsoid: {c: [0.08, 0.11, -0.01], r: [0.045, 0.075, 0.02], rot: '[0.2 + ear, 0, -0.6]'}
    - ellipsoid: {c: [-0.08, 0.11, -0.01], r: [0.045, 0.075, 0.02], rot: '[0.2 + ear, 0, 0.6]'}
  eyes:
    material: eye
    space: head
    min_cover: 1
    prims:
    - sphere: {c: [0.065, 0.04, 0.09], r: 0.02}
    - sphere: {c: [-0.065, 0.04, 0.09], r: 0.02}
  tail:
    material: rump
    space: tail
    prims:
    - ellipsoid: {c: [0, 0.0, -0.03], r: [0.04, 0.05, 0.03]}
  leg_fl:
    material: coat
    space: leg_fl
    prims:
    - cone: {a: [0, 0, 0], b: [0, -0.52, 0], r: [0.05, 0.025]}
  leg_br:
    material: coat
    space: leg_br
    prims:
    - cone: {a: [0, 0.02, 0], b: [0, -0.52, 0], r: [0.06, 0.025]}
  leg_fr:
    material: coat
    space: leg_fr
    prims:
    - cone: {a: [0, 0, 0], b: [0, -0.52, 0], r: [0.05, 0.025]}
  leg_bl:
    material: coat
    space: leg_bl
    prims:
    - cone: {a: [0, 0.02, 0], b: [0, -0.52, 0], r: [0.06, 0.025]}
animations:
  idle:
    frames: 8
    ms: 160
    channels: {bob: 0.01*sin(p), tail: 0.3*sin(2*p), ear: '0.3*pulse(t, 0.6, 0.15)', head_yaw: '0.3*pulse(t, 0.3, 0.2)'}
  walk:
    frames: 8
    ms: 90
    events: {0: step, 4: step}
    channels: {swing_a: 0.55*sin(p), swing_b: -0.55*sin(p), bob: 0.02*abs(sin(p)), head_pitch: 0.06*sin(2*p), ear: 0.15*sin(2*p)}
  graze:
    frames: 8
    ms: 150
    channels: {head_pitch: 1.35 + 0.06*sin(2*p), pitch: '0.05', head_yaw: 0.1*sin(p), tail: 0.3*sin(2*p)}
materials:
  coat: {ramp: coat, bands: [2, 5], finish: soft}
  coat_dark: {ramp: coat_dark, bands: [1, 3]}
  rump: {ramp: rump, bands: [2, 4]}
  eye: {ramp: eye, bands: [0, 1], outline: false}
