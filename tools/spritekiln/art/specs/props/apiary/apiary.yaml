spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: apiary
render: {outline: dark, lines: depth+normal, light: classic, shading: toon}   # like the other SpriteKiln buildings (woodcutter_hut): one dark outline, hard steps
kind: prop
size: 192
directions: [se]          # yaw 45: the 2x2 plot becomes the game's diamond; +z = game +x (door wall), +x = game -y
palette: [../../palettes/kingdom.yaml, ../../palettes/town.yaml]
camera: {pitch: 30, scale: 0.05176, center: [0, 1.55, 0]}
shadow: null
ramps:
  straw:  ['#1a1208', '#3f2e14', '#6a5022', '#93723a', '#b89650', '#d8b870']
  hay:    ['#1c1406', '#4a3812', '#7a6020', '#a88a34', '#cdb050', '#ecd47a']
  mud:    ['#120c08', '#2a1c12', '#3e2a1a', '#523a24', '#664a30']
  slop:   ['#140e08', '#3a2a16', '#5a4424', '#7a5e34']
  wicker: ['#1a1006', '#4a3216', '#74522a', '#9a7038', '#be9250']
  honey:  ['#2a1404', '#6a3a08', '#a8640e', '#d8901c', '#f0b83a', '#fcd870']
  pot:    ['#1a0e08', '#4a2a18', '#7a4628', '#a6643a', '#c88452']
  grass:  ['#14200c', '#26381a', '#34481e', '#3e5424', '#4a602a']
  flower: ['#2a2410', '#8a7a30', '#d8c450', '#f0e070', '#fff4a0']

brief:
  summary: "Your Kingdom apiary (Z1 part 3), 2x2 tiles, the hives on tiles beside it: a small ochre-daubed beekeeper's hut in a dark timber frame with a thatched roof, an open shed with a shelf of spare skeps and honey pots, a bench with jars, a smoker pot, flowers in a grassy yard"
  must_keep: ["footprint 2x2 tiles (4.69 x 4.69 units)", "door on the +z wall at game y about 1.25 (model x -0.59)", "yard tile in front (game x 1..2) free to walk"]

materials:
  plank: {ramp: wood, bands: [2, 5]}
  board: {ramp: plaster_ochre, bands: [2, 5]}
  honey: {ramp: honey, bands: [2, 5], finish: glossy}
  pot: {ramp: pot, bands: [1, 4]}
  grass: {ramp: grass, outline: false}
  flower: {ramp: flower, bands: [3, 4], outline: false}
  post: {ramp: log, bands: [1, 3]}
  thatch: {ramp: straw, bands: [1, 5]}
  thatch_dark: {ramp: straw, bands: [0, 2]}
  stone: {ramp: stone}
  dirt: {ramp: dirt, outline: false}
  mud: {ramp: mud, outline: false}
  hay: {ramp: hay, bands: [2, 5]}
  sack: {ramp: bone, bands: [3, 5]}
  slop: {ramp: slop, outline: false}
  wicker: {ramp: wicker, bands: [2, 4]}
  steel: {ramp: steel, finish: metal}
  ink: {ramp: log, bands: [0, 1], outline: false}

channels: {}
bones: {}

parts:
  yard:
    material: dirt
    prims:
      - box: {c: [0, 0.01, 0], half: [2.30, 0.01, 2.30]}
  plinth:
    material: stone
    prims:
      - box: {c: [0.42, 0.07, -1.0], half: [1.62, 0.07, 1.03], round: 0.02}
    paint:
      - material: ink
        grid: {axes: [x, z], spacing: [0.35, 0.35], r: 0.022}
  walls:             # daub between timbers
    material: board
    prims:
      - box: {c: [0.42, 1.05, -1.0], half: [1.55, 0.92, 0.97]}
  posts:             # corner posts and a sill and a wall plate of darker timber
    material: post
    prims:
      - box: {c: [1.97, 1.05, 0.0], half: [0.08, 0.94, 0.08]}
      - box: {c: [-1.13, 1.05, 0.0], half: [0.08, 0.94, 0.08]}
      - box: {c: [1.97, 1.05, -2.0], half: [0.08, 0.94, 0.08]}
      - box: {c: [0.42, 1.94, 0.0], half: [1.62, 0.07, 0.07]}
      - box: {c: [0.42, 0.2, 0.0], half: [1.62, 0.06, 0.06]}
      - box: {c: [1.97, 1.94, -1.0], half: [0.07, 0.07, 1.03]}
  gables:
    material: plank
    prims:
      - extrude: {c: [1.94, 1.97, -1.0], rot: [0, 1.5708, 0], depth: 0.1,
                  profile: {polygon: [[-1.0, 0], [1.0, 0], [0, 1.1]]}}
      - extrude: {c: [-1.10, 1.97, -1.0], rot: [0, 1.5708, 0], depth: 0.1,
                  profile: {polygon: [[-1.0, 0], [1.0, 0], [0, 1.1]]}}
    paint:
      - material: ink
        stripes: {axis: z, period: 0.22, width: 0.055}
  vent:              # a little round hole under the ridge in the gable
    material: ink
    prims:
      - box: {c: [2.0, 2.45, -1.0], half: [0.03, 0.12, 0.12]}
  roof_front:        # thick thatch, eaves well over the door wall
    material: thatch
    blend: 0.03
    prims:
      - box: {c: [0.42, 2.49, -0.33], half: [1.85, 0.11, 0.92], rot: [0.80, 0, 0], round: 0.05}
    paint:
      - material: thatch_dark
        spots: {scale: 0.12, density: 0.28, seed: 3}
      - material: thatch_dark
        spots: {scale: 0.06, density: 0.2, seed: 11}
  eave:              # the cut edge of the thatch over the door wall
    material: thatch_dark
    prims:
      - cylinder: {a: [-1.43, 1.78, 0.33], b: [2.27, 1.78, 0.33], r: 0.09}
  roof_back:
    material: thatch
    blend: 0.03
    prims:
      - box: {c: [0.42, 2.49, -1.67], half: [1.85, 0.11, 0.92], rot: [-0.80, 0, 0], round: 0.05}
    paint:
      - material: thatch_dark
        spots: {scale: 0.12, density: 0.28, seed: 4}
  ridge:             # bound straw along the ridge
    material: thatch_dark
    prims:
      - cylinder: {a: [-1.45, 3.15, -1.0], b: [2.29, 3.15, -1.0], r: 0.13}
    paint:
      - material: ink
        stripes: {axis: x, period: 0.45, width: 0.06}
  door:
    material: plank
    prims:
      - box: {c: [-0.59, 0.86, 0.0], half: [0.34, 0.68, 0.035]}
    paint:
      - material: ink
        stripes: {axis: x, period: 0.17, width: 0.055}
  door_frame:
    material: post
    prims:
      - box: {c: [-0.98, 0.9, 0.02], half: [0.06, 0.76, 0.06]}
      - box: {c: [-0.20, 0.9, 0.02], half: [0.06, 0.76, 0.06]}
      - box: {c: [-0.59, 1.6, 0.02], half: [0.45, 0.06, 0.06]}
  door_bands:
    material: steel
    prims:
      - box: {c: [-0.59, 0.5, 0.045], half: [0.30, 0.03, 0.01]}
      - box: {c: [-0.59, 1.2, 0.045], half: [0.30, 0.03, 0.01]}
  window:            # a small shuttered hatch
    material: ink
    prims:
      - box: {c: [1.15, 1.25, 0.0], half: [0.24, 0.2, 0.03]}
  shutter:
    material: plank
    prims:
      - box: {c: [1.52, 1.25, 0.12], half: [0.12, 0.2, 0.02], rot: [0, 0.6, 0]}
  shed_roof:         # open lean-to at the -x end (game y 1.5..1.9)
    material: thatch
    blend: 0.02
    prims:
      - box: {c: [-1.68, 1.62, -1.0], half: [0.66, 0.08, 1.12], rot: [0, 0, 0.45], round: 0.04}
    paint:
      - material: thatch_dark
        spots: {scale: 0.12, density: 0.28, seed: 5}
  shed_posts:
    material: post
    prims:
      - cylinder: {a: [-2.15, 0.0, 0.0], b: [-2.15, 1.44, 0.0], r: 0.06}
      - cylinder: {a: [-2.15, 0.0, -1.95], b: [-2.15, 1.44, -1.95], r: 0.06}
      - box: {c: [-2.15, 1.41, -1.0], half: [0.06, 0.05, 1.05]}
  bucket:
    material: plank
    prims:
      - cylinder: {a: [0.2, 0.0, 0.45], b: [0.2, 0.28, 0.45], r: 0.15}
    paint:
      - material: steel
        rings: {axis: y, period: 0.14, width: 0.055}

  braces:
    material: post
    prims:
      - box: {c: [0.42, 1.05, 0.0], half: [0.06, 0.92, 0.05]}
      - box: {c: [1.2, 1.05, 0.0], half: [0.86, 0.05, 0.05], rot: [0, 0, -0.75]}
  grass_patches:
    material: grass
    prims:
      - ellipsoid: {c: [0.8, 0.014, 1.4], r: [0.6, 0.013, 0.45]}
      - ellipsoid: {c: [-0.5, 0.014, 1.8], r: [0.4, 0.013, 0.3]}
    paint:
      - material: flower
        spots: {scale: 0.05, density: 0.25, seed: 9}
  shelf:             # a shelf under the shed with spare skeps
    material: plank
    prims:
      - box: {c: [-1.65, 0.5, -1.0], half: [0.32, 0.04, 0.85]}
      - box: {c: [-1.65, 0.25, -1.75], half: [0.04, 0.25, 0.04]}
      - box: {c: [-1.65, 0.25, -0.25], half: [0.04, 0.25, 0.04]}
  spare_skeps:
    material: thatch
    prims:
      - ellipsoid: {c: [-1.65, 0.75, -1.45], r: [0.24, 0.26, 0.24]}
      - ellipsoid: {c: [-1.65, 0.75, -0.85], r: [0.24, 0.26, 0.24]}
    paint:
      - material: thatch_dark
        stripes: {axis: y, period: 0.1, width: 0.055}
  pots:              # honey pots under the shelf
    material: pot
    prims:
      - cylinder: {a: [-1.6, 0.0, -1.2], b: [-1.6, 0.26, -1.2], r: 0.15}
      - cylinder: {a: [-1.65, 0.0, -0.75], b: [-1.65, 0.22, -0.75], r: 0.13}
  bench:             # a bench by the door with jars of honey
    material: plank
    prims:
      - box: {c: [1.15, 0.36, 0.45], half: [0.5, 0.04, 0.16]}
      - box: {c: [0.75, 0.18, 0.45], half: [0.04, 0.18, 0.12]}
      - box: {c: [1.55, 0.18, 0.45], half: [0.04, 0.18, 0.12]}
  jars:
    material: honey
    prims:
      - cylinder: {a: [0.9, 0.4, 0.45], b: [0.9, 0.6, 0.45], r: 0.09}
      - cylinder: {a: [1.15, 0.4, 0.45], b: [1.15, 0.64, 0.45], r: 0.1}
      - cylinder: {a: [1.4, 0.4, 0.45], b: [1.4, 0.58, 0.45], r: 0.08}
  smoker:            # a clay smoker pot by the door
    material: pot
    prims:
      - cylinder: {a: [-1.4, 0.0, 0.7], b: [-1.4, 0.3, 0.7], r: 0.12}
      - cone: {a: [-1.4, 0.3, 0.7], b: [-1.4, 0.42, 0.7], r: [0.1, 0.03]}

animations:
  idle:
    frames: 1
    ms: 500
    channels: {}
