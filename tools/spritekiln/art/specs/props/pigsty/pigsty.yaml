spritekiln: 1
# Generated by tools/spritekiln/gen_farmsteads.py; edit the script, not this file.
name: pigsty
render: {outline: dark, lines: depth+normal, light: classic, shading: toon}   # like the other SpriteKiln buildings
kind: prop
size: 192
directions: [se]          # yaw 45: the 2x2 plot becomes the game's diamond; +z = game +x (door wall), +x = game -y
palette: [../../palettes/kingdom.yaml, ../../palettes/town.yaml]
camera: {pitch: 30, scale: 0.05176, center: [0, 1.55, 0]}
shadow: null
ramps:
  straw:  ['#1a1208', '#3f2e14', '#6a5022', '#93723a', '#b89650', '#d8b870']
  hay:    ['#1c1406', '#4a3812', '#7a6020', '#a88a34', '#cdb050', '#ecd47a']
  mud:    ['#120c08', '#2a1c12', '#3e2a1a', '#523a24', '#664a30']
  slop:   ['#140e08', '#3a2a16', '#5a4424', '#7a5e34']
  wicker: ['#1a1006', '#4a3216', '#74522a', '#9a7038', '#be9250']
  wool:   ['#2a241c', '#6e6452', '#a39784', '#c8bea8', '#e2dac6', '#f4efe2']
  grass:  ['#14200c', '#26381a', '#34481e', '#3e5424', '#4a602a']
  honey:  ['#2a1404', '#6a3a08', '#a8640e', '#d8901c', '#f0b83a', '#fcd870']
  bloom:  ['#1a0a20', '#4a2058', '#7a3a8a', '#a058b4', '#c886d6']
  petal:  ['#2a1a04', '#6a4a08', '#b08a14', '#e0c030', '#f8e070']

brief:
  summary: "Your Kingdom pigsty (Z1, look of its own 2026-11-11), 2x2 tiles, the pens on tiles beside it: a low fieldstone sty under a board lean-to roof falling to the yard, a low door with a plank half-door, a pig hatch, bedding straw heaped by the side, a trough with slop, a bucket and a pitchfork in the muddy yard"
  must_keep: ["footprint 2x2 tiles (4.69 x 4.69 units)", "door on the +z wall at model x -0.59 (game y about 1.25)", "entrance tile (game x 1..2, model z 0..2.34, model x -2.34..0) free to walk"]

materials:
  plank: {ramp: wood, bands: [2, 5]}
  board: {ramp: log, bands: [2, 5]}
  post: {ramp: log, bands: [1, 3]}
  timber: {ramp: timber, bands: [1, 3]}
  log: {ramp: log, bands: [2, 5]}
  thatch: {ramp: straw, bands: [1, 5]}
  thatch_dark: {ramp: straw, bands: [0, 2]}
  shingle: {ramp: shingle, bands: [2, 5]}
  shingle_dark: {ramp: shingle, bands: [0, 1], outline: false}
  slate: {ramp: slate, bands: [2, 5]}
  slate_dark: {ramp: slate, bands: [0, 1], outline: false}
  daub: {ramp: plaster_cream, bands: [2, 5]}
  stone: {ramp: stone, bands: [2, 5]}
  dirt: {ramp: dirt, outline: false}
  mud: {ramp: mud, outline: false}
  grass: {ramp: grass, outline: false}
  hay: {ramp: hay, bands: [2, 5]}
  sack: {ramp: bone, bands: [3, 5]}
  slop: {ramp: slop, outline: false}
  wicker: {ramp: wicker, bands: [2, 4]}
  wool: {ramp: wool, bands: [2, 5]}
  honey: {ramp: honey, bands: [2, 5], finish: glossy}
  bloom: {ramp: bloom, bands: [2, 4], outline: false}
  petal: {ramp: petal, bands: [2, 4], outline: false}
  steel: {ramp: steel, finish: metal}
  leather: {ramp: cloth, bands: [1, 3]}
  ink: {ramp: log, bands: [0, 1], outline: false}

channels: {}
bones: {}

parts:
  yard:
    material: dirt
    prims:
      - box: {c: [0, 0.01, 0], half: [2.30, 0.01, 2.30]}
  puddle:
    material: mud
    prims:
      - ellipsoid: {c: [0.55, 0.012, 1.25], r: [0.8, 0.012, 0.5]}
      - ellipsoid: {c: [-0.4, 0.012, 1.8], r: [0.5, 0.012, 0.32]}
      - ellipsoid: {c: [1.6, 0.012, 0.35], r: [0.45, 0.012, 0.3]}
  walls:             # rough fieldstone, higher at the back under the lean-to roof
    material: stone
    prims:
      - box: {c: [0.15, 0.95, -1.12], half: [2.0, 0.95, 1.0], round: 0.04}
    cut:
      - plane: {n: [0, 0.957, 0.291], c: [0, 1.32, -1.12]}
    paint:
      - material: ink
        spots: {scale: 0.09, density: 0.22, seed: 7}
  roof:              # boards on rafters, falling towards the yard
    material: board
    prims:
      - box: {c: [0.15, 1.46, -1.02], half: [2.18, 0.06, 1.38], rot: [0.30, 0, 0]}
    paint:
      - material: ink
        stripes: {axis: x, period: 0.28, width: 0.055}
  rafters:           # the ends of the rafters under the front edge
    material: post
    prims:
      - box: {c: [-1.5, 1.02, 0.28], half: [0.05, 0.05, 0.12]}
      - box: {c: [-0.2, 1.02, 0.28], half: [0.05, 0.05, 0.12]}
      - box: {c: [1.1, 1.02, 0.28], half: [0.05, 0.05, 0.12]}
  door:              # a low opening with a plank half-door
    material: ink
    prims:
      - box: {c: [-0.59, 0.55, -0.1], half: [0.34, 0.52, 0.04]}
  half_door:
    material: plank
    prims:
      - box: {c: [-0.59, 0.28, -0.07], half: [0.32, 0.27, 0.035]}
    paint:
      - material: ink
        stripes: {axis: x, period: 0.16, width: 0.055}
  lintel:
    material: post
    prims:
      - box: {c: [-0.59, 1.1, -0.08], half: [0.46, 0.06, 0.06]}
  hatch:             # a pig hatch low in the wall
    material: ink
    prims:
      - box: {c: [1.2, 0.26, -0.1], half: [0.24, 0.22, 0.04]}
  straw_heap:        # bedding straw heaped against the side wall
    material: thatch
    blend: 0.06
    prims:
      - ellipsoid: {c: [-2.0, 0.25, -1.4], r: [0.32, 0.3, 0.6]}
      - ellipsoid: {c: [-1.95, 0.15, -0.6], r: [0.3, 0.17, 0.4]}
  trough:
    material: plank
    prims:
      - box: {c: [1.25, 0.17, 1.2], half: [0.62, 0.17, 0.24]}
    cut:
      - box: {c: [1.25, 0.30, 1.2], half: [0.54, 0.16, 0.16]}
  slop:
    material: slop
    prims:
      - box: {c: [1.25, 0.24, 1.2], half: [0.54, 0.02, 0.16]}
  bucket:
    material: plank
    prims:
      - cylinder: {a: [0.3, 0.0, 0.5], b: [0.3, 0.28, 0.5], r: 0.15}
    paint:
      - material: steel
        rings: {axis: y, period: 0.14, width: 0.055}

animations:
  idle:
    frames: 1
    ms: 500
    channels: {}
