spritekiln: 1
# G3 part 2b. Held in the right fist; the tool runs along the hand frame's +y (the townsfolk
# turn it in the torso's frame through the bone `bell`, gen_civilians.py).
kit: bell
license: CC0-1.0
summary: "a brass hand bell hanging under the fist on a short handle"
host: humanoid
at: wrist_R
params:
  tilt: 0.4          # lean from the fist when no host turns it (radians about the hand's x)

materials:
  steel: {ramp: steel, finish: metal}
  wood: {ramp: wood, finish: matte, bands: [2, 5]}
  brass: {ramp: gold, finish: metal, bands: [1, 4]}

bones:
  bell: {parent: at, pos: [0, 0, 0.035], rot: "[tilt, 0, 0]"}

parts:
  handle:
    material: wood
    space: bell
    priority: 2
    prims:
      - cylinder: {a: [0, -0.02, 0], b: [0, 0.07, 0], r: 0.018}
  bell:
    material: brass
    space: bell
    priority: 2
    prims:
      - cone: {a: [0, -0.03, 0], b: [0, -0.15, 0], r: [0.03, 0.075]}
