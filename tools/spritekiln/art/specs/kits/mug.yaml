    material: wood
    space: mug
    priority: 2
    blend: 0.01
    prims:
      - cylinder: {a: [0, -0.06, 0.075], b: [0, 0.09, 0.075], r: 0.062}
      - torus: {c: [0.0, 0.015, 0.0], R: 0.04, r: 0.012, rot: [0, 0, 1.5708]}
  foam:
    material: foam
    space: mug
    priority: 2
    prims:
      - ellipsoid: {c: [0, 0.095, 0.075], r: [0.062, 0.026, 0.062]}
