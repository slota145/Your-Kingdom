spritekiln: 1
# G3 part 2b. Held in the right fist; the tool runs along the hand frame's +y (the townsfolk
# turn it in the torso's frame through the bone `saw`, gen_civilians.py).
kit: saw
license: CC0-1.0
summary: "a carpenter's frame-less hand saw: a long tapering steel blade from a wooden grip"
host: humanoid
at: wrist_R
params:
  tilt: 0.4          # lean from the fist when no host turns it (radians about the hand's x)

materials:
  steel: {ramp: steel, finish: metal}
  wood: {ramp: wood, finish: matte, bands: [2, 5]}

bones:
  saw: {parent: at, pos: [0, 0, 0.035], rot: "[tilt, 0, 0]"}

parts:
  grip:
    material: wood
    space: saw
    priority: 2
    prims:
      - box: {c: [0, 0.0, -0.02], half: [0.02, 0.06, 0.05]}
  blade:
    material: steel
    space: saw
    priority: 2
    prims:
      - extrude: {c: [0, 0.32, 0], rot: [0, 1.5708, 0], depth: 0.012, profile: {polygon: [[0.0, -0.26], [0.0, 0.26], [0.06, 0.26], [0.1, -0.26]]}}
