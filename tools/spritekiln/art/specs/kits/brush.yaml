spritekiln: 1
# G3 part 2a. Held in the right fist; the tool runs along the hand frame's +y (the townsfolk
# turn it in the torso's frame through the bone `brush`, gen_civilians.py).
kit: brush
license: CC0-1.0
summary: "a curry brush: a wooden back with dark bristles"
host: humanoid
at: wrist_R
params:
  tilt: 0.4          # lean from the fist when no host turns it (radians about the hand's x)

materials:
  steel: {ramp: steel, finish: metal}
  wood: {ramp: wood, finish: matte, bands: [2, 5]}

bones:
  brush: {parent: at, pos: [0, 0, 0.035], rot: "[tilt, 0, 0]"}

parts:
  back:
    material: wood
    space: brush
    priority: 2
    prims:
      - box: {c: [0, 0.07, 0], half: [0.06, 0.08, 0.03]}
  bristles:
    material: steel
    space: brush
    priority: 2
    prims:
      - box: {c: [0, 0.07, 0.04], half: [0.05, 0.07, 0.015]}
